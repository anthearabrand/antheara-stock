<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANTHEARA · สต๊อก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf6f0; --card:#fff; --ink:#3a2318; --ink2:#8a7360; --line:#ece2d5;
    --accent:#9a6238; --accent-soft:#f4ece0; --dark:#3d2419; --cream:#ece4d1;
    --ok:#4a7a43; --warn:#bd7a2c; --danger:#b23f2e;
    --ok-soft:#e8f0e2; --warn-soft:#f7ead4; --danger-soft:#f6e3de;
    --radius:16px; --shadow:0 4px 20px rgba(61,36,25,.07);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Prompt",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  .wordmark{font-family:"Cormorant Garamond",serif}
  button,input,select{font-family:"Prompt";font-size:15px}
  button{cursor:pointer}

  /* ===== TOP BAR ===== */
  .top{background:var(--dark);color:var(--cream);padding:16px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20}
  .top .brand{font-family:"Cormorant Garamond",serif;font-weight:700;font-size:26px;line-height:1}
  .top .brand small{font-family:"Prompt";font-weight:500;font-size:10px;letter-spacing:.14em;display:block;color:rgba(236,228,209,.6);margin-top:2px}
  .sync{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:rgba(236,228,209,.7)}
  .sync::before{content:"";width:8px;height:8px;border-radius:50%;background:rgba(236,228,209,.4)}
  .sync.ok::before{background:#7fbf6a}.sync.ok{color:rgba(236,228,209,.85)}
  .sync.saving::before{background:#e0b24a;animation:pulse 1s infinite}
  .sync.err::before{background:#d98d6a}.sync.err{color:#eab79c}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  .wrap{max-width:820px;margin:0 auto;padding:18px 16px 60px}

  /* ===== STATS ===== */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
  .stat .k{font-size:13px;color:var(--ink2);font-weight:500}
  .stat .v{font-size:28px;font-weight:700;margin-top:2px}
  .stat.warn .v{color:var(--warn)} .stat.danger .v{color:var(--danger)}

  /* ===== TOOLBAR ===== */
  .bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
  .search{flex:1;min-width:180px;position:relative}
  .search input{width:100%;padding:12px 14px 12px 40px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
  .search input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .search::before{content:"🔍";position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.5}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:11px 18px;border-radius:12px;font-weight:600;font-size:14.5px;border:1px solid var(--line);background:#fff;color:var(--ink);transition:.12s;white-space:nowrap}
  .btn:hover{border-color:#d8c9b6;background:#fdfbf8}
  .btn-primary{background:var(--dark);color:var(--cream);border-color:var(--dark)}
  .btn-primary:hover{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn-sm{padding:8px 13px;font-size:13.5px;border-radius:10px}

  /* ===== ITEM LIST ===== */
  .list{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #f4ece2}
  .item:last-child{border-bottom:0}
  .item .info{flex:1;min-width:0}
  .item .nm{font-weight:600;font-size:16px}
  .item .meta{font-size:12.5px;color:var(--ink2);margin-top:1px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
  .chip{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px}
  .c-ok{background:var(--ok-soft);color:var(--ok)}.c-warn{background:var(--warn-soft);color:var(--warn)}.c-danger{background:var(--danger-soft);color:var(--danger)}

  /* qty stepper */
  .qtybox{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#fff}
  .qtybox button{width:38px;height:42px;border:0;background:#faf6f0;color:var(--ink);font-size:20px;font-weight:600;line-height:1}
  .qtybox button:hover{background:var(--accent-soft);color:var(--accent)}
  .qtybox input{width:74px;height:42px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);text-align:center;font-weight:700;font-size:16px;color:var(--ink);background:#fff;-moz-appearance:textfield}
  .qtybox input::-webkit-outer-spin-button,.qtybox input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .qtybox input:focus{outline:0;background:var(--accent-soft)}
  .unit{font-size:13px;color:var(--ink2);min-width:34px}
  .icon-btn{background:none;border:0;font-size:16px;padding:6px 7px;border-radius:8px;color:var(--ink2)}
  .icon-btn:hover{background:#f4ece2;color:var(--ink)}
  .icon-btn.danger:hover{background:var(--danger-soft);color:var(--danger)}

  .empty{padding:44px 20px;text-align:center;color:var(--ink2)}
  .empty .big{font-size:38px;margin-bottom:8px}

  .list-head{display:flex;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink2);font-weight:600;background:#fdfbf8}

  /* ===== MODAL ===== */
  .modal-bg{display:none;position:fixed;inset:0;background:rgba(61,36,25,.5);z-index:60;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
  .modal-bg.show{display:flex}
  .modal{background:#fff;border-radius:18px;box-shadow:0 24px 70px rgba(61,36,25,.3);width:100%;max-width:420px;overflow:hidden;animation:pop .16s ease}
  @keyframes pop{from{transform:translateY(8px);opacity:.6}to{transform:none;opacity:1}}
  .mh{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
  .mh h3{font-size:18px;font-weight:700}.mh .x{margin-left:auto;background:none;border:0;font-size:22px;color:var(--ink2)}
  .mb{padding:18px 20px}
  .mf{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--line);background:#fdfbf8}
  .mf .btn{flex:1;justify-content:center}
  .field{margin-bottom:14px}.field:last-child{margin-bottom:0}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
  .field input,.field select{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink)}
  .field input:focus,.field select:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .field .hint{font-size:12px;color:var(--ink2);margin-top:5px}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--dark);color:var(--cream);padding:12px 20px;border-radius:12px;font-weight:600;font-size:14px;z-index:80;box-shadow:0 12px 34px rgba(0,0,0,.25);opacity:0;transition:.2s;pointer-events:none}
  .toast.show{opacity:1;bottom:34px}.toast.err{background:var(--danger);color:#fff}

  .foot{text-align:center;margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

  @media(max-width:520px){
    .stats{grid-template-columns:repeat(3,1fr);gap:8px}
    .stat{padding:12px 10px}.stat .v{font-size:22px}.stat .k{font-size:11px}
    .item{gap:8px;padding:12px}
    .item .nm{font-size:15px}
    .qtybox input{width:56px}.qtybox button{width:34px}
    .list-head{display:none}
  }
</style>
</head>
<body>
<div class="top">
  <div class="brand">Anthēara<small>สต๊อกสินค้า</small></div>
  <div id="sync" class="sync">กำลังโหลด…</div>
</div>

<div class="wrap">
  <div class="stats">
    <div class="stat"><div class="k">รายการทั้งหมด</div><div class="v" id="s-all">—</div></div>
    <div class="stat warn"><div class="k">ใกล้หมด</div><div class="v" id="s-low">—</div></div>
    <div class="stat danger"><div class="k">ของหมด</div><div class="v" id="s-out">—</div></div>
  </div>

  <div class="bar">
    <div class="search"><input id="q" placeholder="ค้นหาสินค้า…" oninput="render()"></div>
    <button class="btn btn-primary" onclick="editItem()">+ เพิ่มสินค้า</button>
  </div>

  <div id="view"></div>

  <div class="foot">
    <button class="btn btn-sm" onclick="exportCSV()">⬇︎ ออกไฟล์ CSV</button>
    <button class="btn btn-sm" onclick="zeroAll()">ตั้งยอดทั้งหมดเป็น 0</button>
  </div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
/* ============ Supabase (โปรเจกต์ anther) ============ */
const KEY = "antheara_stock";
const SUPABASE_URL = "https://hddwywofpqqlufslshaq.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhkZHd5d29mcHFxbHVmc2xzaGFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMTMwNTQsImV4cCI6MjEwMDg4OTA1NH0.MqxmX9uv78NkVw7c-E9hZfONt19yW3HX1-XpOv_4AMw";
const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

let state = { items: [], _v: 2 };

/* ---- แปลงข้อมูลเก่า (products+movements หลายที่) → แบบง่าย (items+qty) ---- */
function migrate(s){
  if(!s || typeof s!=="object") return { items:[], _v:2 };
  if(Array.isArray(s.items)) return { items:s.items, _v:2, _legacy:s._legacy };
  // ข้อมูลเก่า: รวมยอดคงเหลือทุกที่ต่อสินค้า
  const bal = {};
  (s.movements||[]).forEach(m=>{ bal[m.productId]=(bal[m.productId]||0)+(m.kind==="รับเข้า"?m.qty:-m.qty); });
  const items = (s.products||[]).map(p=>({
    id:p.id, name:p.name, category:p.category||"", unit:p.unit||"ชิ้น",
    cost:p.cost||0, reorderPoint:p.reorderPoint||0, qty:Math.max(0, Math.round((bal[p.id]||0)*100)/100)
  }));
  // เก็บข้อมูลเดิมไว้กันหาย (ไม่แสดง แต่ไม่ลบ)
  return { items, _v:2, _legacy:{products:s.products,movements:s.movements,locations:s.locations,purchaseOrders:s.purchaseOrders,productionRuns:s.productionRuns} };
}

/* ---- sync ---- */
function setSync(t,c){ const e=document.getElementById("sync"); if(e){e.textContent=t;e.className="sync "+(c||"");} }
function cacheLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
let _t=null,_busy=false,_again=false;
function save(){ cacheLocal(); setSync("กำลังบันทึก…","saving"); clearTimeout(_t); _t=setTimeout(cloud,600); }
async function cloud(){
  if(!sb){ setSync("ออฟไลน์ (เก็บในเครื่อง)","err"); return; }
  if(_busy){ _again=true; return; } _busy=true;
  try{ const {error}=await sb.rpc("rpc_stock_save",{p_data:state}); if(error) throw error; setSync("บันทึกแล้ว ✓","ok"); }
  catch(e){ console.warn(e); setSync("ออฟไลน์ (เก็บในเครื่อง)","err"); }
  _busy=false; if(_again){_again=false;cloud();}
}
async function boot(){
  setSync("กำลังโหลด…","saving");
  let localData=null; try{ const r=localStorage.getItem(KEY); if(r) localData=JSON.parse(r); }catch(e){}
  let loaded=false;
  if(sb){
    try{
      const {data,error}=await sb.rpc("rpc_stock_load"); if(error) throw error;
      const has = data && (Array.isArray(data.items)? data.items.length : (data.products&&data.products.length));
      if(has){ state=migrate(data); loaded=true; setSync("เชื่อมต่อแล้ว ✓","ok"); }
      else {
        state = (localData && (localData.items||localData.products)) ? migrate(localData) : {items:[],_v:2};
        await sb.rpc("rpc_stock_save",{p_data:state}); loaded=true; setSync("เชื่อมต่อแล้ว ✓","ok");
      }
    }catch(e){ console.warn("Supabase:",e); }
  }
  if(!loaded){ state = localData? migrate(localData) : {items:[],_v:2}; setSync("ออฟไลน์ (เก็บในเครื่อง)","err"); }
  cacheLocal(); render();
}

/* ---- helpers ---- */
const uid = ()=> "I"+Date.now().toString(36)+Math.floor(Math.random()*1000).toString(36);
const fmt = n=> (Math.round((n||0)*100)/100).toLocaleString("th-TH");
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function statusOf(it){ const q=it.qty||0; if(q<=0) return {k:"หมด",c:"c-danger"}; if(q<=(it.reorderPoint||0)) return {k:"ใกล้หมด",c:"c-warn"}; return {k:"พอ",c:"c-ok"}; }

/* ---- render ---- */
function render(){
  const all=state.items, low=all.filter(i=>{const q=i.qty||0;return q>0&&q<=(i.reorderPoint||0);}), out=all.filter(i=>(i.qty||0)<=0);
  document.getElementById("s-all").textContent=all.length;
  document.getElementById("s-low").textContent=low.length;
  document.getElementById("s-out").textContent=out.length;
  const term=(document.getElementById("q").value||"").trim().toLowerCase();
  const shown = term? all.filter(i=>i.name.toLowerCase().includes(term)||(i.category||"").toLowerCase().includes(term)) : all;
  const view=document.getElementById("view");
  if(all.length===0){ view.innerHTML=`<div class="list"><div class="empty"><div class="big">📦</div>ยังไม่มีสินค้า — กด “+ เพิ่มสินค้า” เพื่อเริ่ม</div></div>`; return; }
  if(shown.length===0){ view.innerHTML=`<div class="list"><div class="empty"><div class="big">🔍</div>ไม่พบ “${esc(term)}”</div></div>`; return; }
  const rows = shown.map(it=>{ const st=statusOf(it);
    return `<div class="item">
      <div class="info">
        <div class="nm">${esc(it.name)}</div>
        <div class="meta">${it.category?`<span class="tag">${esc(it.category)}</span>`:""}<span class="chip ${st.c}">${st.k}</span>${it.reorderPoint?`<span>เตือนเมื่อ ≤ ${fmt(it.reorderPoint)}</span>`:""}</div>
      </div>
      <div class="qtybox">
        <button onclick="bump('${it.id}',-1)">−</button>
        <input type="number" step="any" value="${it.qty||0}" onchange="setQty('${it.id}',this.value)" onfocus="this.select()">
        <button onclick="bump('${it.id}',1)">+</button>
      </div>
      <span class="unit">${esc(it.unit||"")}</span>
      <button class="icon-btn" title="แก้ไข" onclick="editItem('${it.id}')">✏️</button>
      <button class="icon-btn danger" title="ลบ" onclick="delItem('${it.id}')">🗑️</button>
    </div>`;
  }).join("");
  view.innerHTML=`<div class="list"><div class="list-head">สินค้า (${shown.length}${term?` จาก ${all.length}`:""}) · พิมพ์จำนวนที่มีได้เลย</div>${rows}</div>`;
}
const byId = id=> state.items.find(i=>i.id===id);
function setQty(id,val){ const it=byId(id); if(!it) return; it.qty=Math.max(0, parseFloat(val)||0); save(); render(); }
function bump(id,d){ const it=byId(id); if(!it) return; it.qty=Math.max(0,(it.qty||0)+d); save(); render(); }

/* ---- add / edit ---- */
const UNITS=["ชิ้น","ใบ","ขวด","โล","กรัม","กล่อง","หลอด","แพ็ค"];
function editItem(id){
  const it=id?byId(id):null;
  openModal(`
    <div class="mh"><h3>${it?"แก้ไขสินค้า":"เพิ่มสินค้า"}</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="mb">
      <div class="field"><label>ชื่อสินค้า *</label><input id="f-name" value="${it?esc(it.name):""}" placeholder="เช่น สครับ AHA 300g"></div>
      <div class="frow">
        <div class="field"><label>หน่วย *</label><input id="f-unit" list="ul" value="${it?esc(it.unit):"ชิ้น"}" placeholder="ชิ้น/ใบ/โล"><datalist id="ul">${UNITS.map(u=>`<option value="${u}">`).join("")}</datalist></div>
        <div class="field"><label>จำนวนที่มีตอนนี้</label><input id="f-qty" type="number" step="any" value="${it?it.qty:0}" placeholder="0"></div>
      </div>
      <div class="frow">
        <div class="field"><label>เตือนเมื่อเหลือ ≤</label><input id="f-rop" type="number" step="any" value="${it?it.reorderPoint:""}" placeholder="เช่น 100"></div>
        <div class="field"><label>ต้นทุน/หน่วย (ไม่บังคับ)</label><input id="f-cost" type="number" step="any" value="${it?(it.cost||""):""}" placeholder="0"></div>
      </div>
    </div>
    <div class="mf"><button class="btn" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" onclick="saveItem('${id||""}')">${it?"บันทึก":"เพิ่ม"}</button></div>`);
  setTimeout(()=>document.getElementById("f-name").focus(),50);
}
function saveItem(id){
  const name=document.getElementById("f-name").value.trim();
  if(!name){ toast("ใส่ชื่อสินค้าก่อน",true); return; }
  const unit=document.getElementById("f-unit").value.trim()||"ชิ้น";
  const qty=Math.max(0,parseFloat(document.getElementById("f-qty").value)||0);
  const rop=parseFloat(document.getElementById("f-rop").value)||0;
  const cost=parseFloat(document.getElementById("f-cost").value)||0;
  if(id){ const it=byId(id); Object.assign(it,{name,unit,qty,reorderPoint:rop,cost}); toast("บันทึกแล้ว"); }
  else{ state.items.push({id:uid(),name,unit,qty,reorderPoint:rop,cost,category:""}); toast("เพิ่มสินค้าแล้ว"); }
  save(); closeModal(); render();
}
function delItem(id){
  const it=byId(id); if(!it) return;
  openModal(`<div class="mh"><h3>ลบสินค้า?</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="mb">ลบ <b>${esc(it.name)}</b> ออกจากรายการใช่ไหม?</div>
    <div class="mf"><button class="btn" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" style="background:var(--danger);border-color:var(--danger)" onclick="confirmDel('${id}')">ลบเลย</button></div>`);
}
function confirmDel(id){ state.items=state.items.filter(i=>i.id!==id); save(); closeModal(); toast("ลบแล้ว"); render(); }

function zeroAll(){
  openModal(`<div class="mh"><h3>ตั้งยอดทั้งหมดเป็น 0?</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="mb">จำนวนของทุกสินค้าจะกลับเป็น <b>0</b> (เก็บรายชื่อสินค้าไว้เหมือนเดิม) — เหมาะกับเริ่มนับสต๊อกใหม่
    <div class="hint" style="color:var(--danger);margin-top:6px">⚠️ ตัวเลขที่กรอกไว้จะหายหมด</div></div>
    <div class="mf"><button class="btn" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" style="background:var(--danger);border-color:var(--danger)" onclick="confirmZero()">ตั้งเป็น 0</button></div>`);
}
function confirmZero(){ state.items.forEach(i=>i.qty=0); save(); closeModal(); toast("ตั้งเป็น 0 แล้ว"); render(); }

function exportCSV(){
  const rows=[["ชื่อสินค้า","หน่วย","จำนวนคงเหลือ","เตือนเมื่อ≤","ต้นทุน/หน่วย","สถานะ"]];
  state.items.forEach(i=>rows.push([i.name,i.unit,i.qty||0,i.reorderPoint||0,i.cost||0,statusOf(i).k]));
  const csv=rows.map(r=>r.map(c=>{const s=String(c==null?"":c);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(",")).join("\n");
  const b=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8;"}),u=URL.createObjectURL(b),a=document.createElement("a");
  a.href=u;a.download="antheara-สต๊อก.csv";a.click();setTimeout(()=>URL.revokeObjectURL(u),500);
}

/* ---- modal + toast ---- */
function openModal(h){ document.getElementById("modal").innerHTML=h; document.getElementById("modalBg").classList.add("show"); }
function closeModal(){ document.getElementById("modalBg").classList.remove("show"); }
document.getElementById("modalBg").addEventListener("mousedown",e=>{if(e.target.id==="modalBg")closeModal();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});
let _tt=null; function toast(m,err){ const t=document.getElementById("toast"); t.textContent=m; t.className="toast show"+(err?" err":""); clearTimeout(_tt); _tt=setTimeout(()=>t.className="toast"+(err?" err":""),2200); }

boot();
