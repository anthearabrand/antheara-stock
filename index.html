<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANTHEARA · สต๊อกการผลิต</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf6f0; --card:#fff; --ink:#3a2318; --ink2:#8a7360; --line:#ece2d5;
    --accent:#9a6238; --accent-soft:#f4ece0; --dark:#3d2419; --cream:#ece4d1;
    --ok:#4a7a43; --warn:#bd7a2c; --danger:#b23f2e;
    --ok-soft:#e8f0e2; --warn-soft:#f7ead4; --danger-soft:#f6e3de;
    --radius:15px; --shadow:0 4px 20px rgba(61,36,25,.07);
    --sw:230px; --th:60px;
  }
  *{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
  body{font-family:"Prompt",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  button,input,select{font-family:"Prompt";font-size:15px}button{cursor:pointer}

  .app{display:flex;min-height:100vh}
  .sidebar{width:var(--sw);background:var(--dark);position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;z-index:40;transition:transform .22s}
  .brand{padding:22px 20px 18px;border-bottom:1px solid rgba(236,228,209,.14)}
  .brand .wm{font-family:"Cormorant Garamond",serif;font-weight:700;font-size:30px;line-height:1;color:var(--cream)}
  .brand .sub{font-weight:500;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:rgba(236,228,209,.55);margin-top:6px}
  .nav{padding:14px 12px;overflow-y:auto;flex:1}
  .nav a{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:11px;color:rgba(236,228,209,.72);font-weight:500;font-size:14.5px;margin-bottom:3px;transition:.12s}
  .nav a .ic{font-size:18px;width:22px;text-align:center}
  .nav a:hover{background:rgba(236,228,209,.08);color:var(--cream)}
  .nav a.active{background:rgba(236,228,209,.15);color:var(--cream);font-weight:600}
  .nav a .dot{margin-left:auto;background:var(--danger);color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:none;align-items:center;justify-content:center;padding:0 5px}
  .nav a .dot.show{display:inline-flex}
  .sb-foot{padding:14px 18px;border-top:1px solid rgba(236,228,209,.14)}
  .sync{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;color:rgba(236,228,209,.6)}
  .sync::before{content:"";width:7px;height:7px;border-radius:50%;background:rgba(236,228,209,.4);flex:none}
  .sync.ok::before{background:#7fbf6a}.sync.ok{color:rgba(236,228,209,.75)}
  .sync.saving::before{background:#e0b24a;animation:pulse 1s infinite}
  .sync.err::before{background:#d98d6a}.sync.err{color:#e6b79c}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  .main{flex:1;margin-left:var(--sw);display:flex;flex-direction:column;min-width:0}
  .topbar{height:var(--th);background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 22px;position:sticky;top:0;z-index:30}
  .topbar .burger{display:none;background:none;border:0;font-size:22px;color:var(--ink)}
  .topbar h1{font-size:19px;font-weight:700}
  .topbar .alert{margin-left:auto;font-size:13px;font-weight:600;color:var(--warn);background:var(--warn-soft);padding:7px 13px;border-radius:999px;display:none}
  .topbar .alert.show{display:block}
  .content{padding:22px;max-width:1000px;width:100%}
  .backdrop{display:none;position:fixed;inset:0;background:rgba(61,36,25,.4);z-index:35}.backdrop.show{display:block}

  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
  .kcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:17px}
  .kcard .k{font-size:13px;color:var(--ink2);font-weight:500}
  .kcard .v{font-size:25px;font-weight:700;margin-top:3px}
  .kcard.warn .v{color:var(--warn)}.kcard.danger .v{color:var(--danger)}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px}
  .ph{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .ph h2{font-size:16px;font-weight:700}.ph .sub{font-size:12px;color:var(--ink2);font-weight:400}
  .ph .tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:14.5px;min-width:520px}
  thead th{text-align:left;font-size:12px;color:var(--ink2);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fdfbf8}
  thead th.r{text-align:right}
  tbody td{padding:8px 12px;border-bottom:1px solid #f4ece2;vertical-align:middle}
  tbody tr:last-child td{border-bottom:0}
  .cell{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);text-align:right;font-weight:600}
  .cell.name{text-align:left}
  .cell:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  td.num{width:110px}td.namecol{min-width:150px}td.small{width:88px}
  .chip{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .c-ok{background:var(--ok-soft);color:var(--ok)}.c-warn{background:var(--warn-soft);color:var(--warn)}.c-danger{background:var(--danger-soft);color:var(--danger)}
  .tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
  .money{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
  .icon-btn{background:none;border:0;font-size:16px;padding:6px 7px;border-radius:8px;color:var(--ink2)}
  .icon-btn:hover{background:#f4ece2;color:var(--danger)}.icon-btn.in:hover{background:var(--ok-soft);color:var(--ok)}
  .foot-row td{padding:12px;font-weight:700;background:#fdfbf8;border-top:2px solid var(--line)}
  .mgroup td{background:#f2e9db;font-weight:700;font-size:13.5px;color:var(--accent);padding:9px 12px}
  .icon-btn.hasdoc{color:var(--accent)}
  .empty{padding:26px 18px;text-align:center;color:var(--ink2)}

  .btn{display:inline-flex;align-items:center;gap:7px;padding:10px 16px;border-radius:11px;font-weight:600;font-size:14px;border:1px solid var(--line);background:#fff;color:var(--ink);transition:.12s;white-space:nowrap}
  .btn:hover{border-color:#d8c9b6;background:#fdfbf8}
  .btn-primary{background:var(--dark);color:var(--cream);border-color:var(--dark)}
  .btn-primary:hover{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn-sm{padding:8px 13px;font-size:13px}.btn-lg{padding:16px 30px;font-size:17px;border-radius:13px}
  .produce-hero{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:30px 20px;text-align:center;margin-bottom:18px}
  .produce-hero .h{font-size:17px;font-weight:700;margin-bottom:4px}
  .produce-hero .flowhint{color:var(--ink2);font-size:13px;margin-top:10px}

  .modal-bg{display:none;position:fixed;inset:0;background:rgba(61,36,25,.5);z-index:60;align-items:flex-start;justify-content:center;padding:34px 14px;overflow-y:auto}
  .modal-bg.show{display:flex}
  .modal{background:#fff;border-radius:18px;box-shadow:0 24px 70px rgba(61,36,25,.3);width:100%;max-width:480px;overflow:hidden;animation:pop .16s}
  @keyframes pop{from{transform:translateY(8px);opacity:.6}to{transform:none;opacity:1}}
  .mh{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}.mh h3{font-size:18px;font-weight:700}.mh .x{margin-left:auto;background:none;border:0;font-size:22px;color:var(--ink2)}
  .mb{padding:18px 20px}.mf{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--line);background:#fdfbf8}.mf .btn{flex:1;justify-content:center}
  .field{margin-bottom:13px}.field:last-child{margin-bottom:0}.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
  .field input,.field select{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink)}
  .field input:focus,.field select:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .userow{display:grid;grid-template-columns:1fr 78px 30px;gap:8px;align-items:center;margin-bottom:8px}
  .userow select,.userow input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px}
  .prev{background:#f6f2ec;border-radius:11px;padding:12px 14px;margin-top:10px;font-size:13.5px;line-height:1.7}.prev b{font-weight:700}.bad{color:var(--danger);font-weight:700}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--dark);color:var(--cream);padding:12px 20px;border-radius:12px;font-weight:600;font-size:14px;z-index:80;box-shadow:0 12px 34px rgba(0,0,0,.25);opacity:0;transition:.2s;pointer-events:none}
  .toast.show{opacity:1;bottom:34px}.toast.err{background:var(--danger);color:#fff}

  @media(max-width:820px){.cards{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:760px){
    .sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}
    .main{margin-left:0}.topbar .burger{display:block}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="wm">Anthēara</div><div class="sub">สต๊อกการผลิต</div></div>
    <nav class="nav" id="nav">
      <a data-r="dash"><span class="ic">📊</span> แดชบอร์ด<span class="dot" id="navDot"></span></a>
      <a data-r="mats"><span class="ic">🧪</span> วัตถุดิบ</a>
      <a data-r="produce"><span class="ic">🏭</span> สั่งผลิต</a>
      <a data-r="fin"><span class="ic">📦</span> สินค้าสำเร็จรูป</a>
      <a data-r="wh"><span class="ic">🏬</span> คลังรังสิต</a>
      <a data-r="pays"><span class="ic">💰</span> เงินที่สั่ง</a>
    </nav>
    <div class="sb-foot"><div id="sync" class="sync">กำลังโหลด…</div></div>
  </aside>
  <div class="backdrop" id="backdrop"></div>

  <div class="main">
    <header class="topbar">
      <button class="burger" id="burger">☰</button>
      <h1 id="pageTitle">แดชบอร์ด</h1>
      <div class="alert" id="topAlert"></div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
const KEY="antheara_stock";
const SUPABASE_URL="https://hddwywofpqqlufslshaq.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ 9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhkZHd5d29mcHFxbHVmc2xzaGFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMTMwNTQsImV4cCI6MjEwMDg4OTA1NH0.MqxmX9uv78NkVw7c-E9hZfONt19yW3HX1-XpOv_4AMw".replace(/\s/g,'');
const sb=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;

let state={materials:[],finished:[],warehouse:[],recipes:{},productions:[],payments:[],_v:6};

function migrate(s){
  if(!s||typeof s!=="object") return {materials:[],finished:[],warehouse:[],recipes:{},productions:[],payments:[],_v:6};
  if(s._v===6||s._v===5||s._v===4){ s.materials=s.materials||[];s.finished=s.finished||[];s.warehouse=s.warehouse||[];s.recipes=s.recipes||{};s.productions=s.productions||[];s.payments=s.payments||[];s._v=6; return s; }
  const materials=Array.isArray(s.materials)?s.materials.map(m=>({id:m.id,name:m.name,plant:m.plant||'',qty:m.qty||0,unit:m.unit||'',reorder:m.reorder||0})):[];
  const payments=Array.isArray(s.payments)?s.payments:[];
  const legacy=s._legacy||{rounds:s.rounds,products:s.products,items:s.items,movements:s.movements,locations:s.locations};
  return {materials,finished:[],warehouse:[],recipes:{},productions:[],payments,_v:6,_legacy:legacy};
}

function setSync(t,c){const e=document.getElementById("sync");if(e){e.textContent=t;e.className="sync "+(c||"");}}
function cacheLocal(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
let _t=null,_busy=false,_again=false;
function save(){cacheLocal();setSync("กำลังบันทึก…","saving");clearTimeout(_t);_t=setTimeout(cloud,600);}
async function cloud(){
  if(!sb){setSync("ออฟไลน์ (เก็บในเครื่อง)","err");return;}
  if(_busy){_again=true;return;}_busy=true;
  try{const{error}=await sb.rpc("rpc_stock_save",{p_data:state});if(error)throw error;setSync("บันทึกแล้ว ✓","ok");}
  catch(e){console.warn(e);setSync("ออฟไลน์ (เก็บในเครื่อง)","err");}
  _busy=false;if(_again){_again=false;cloud();}
}
async function boot(){
  setSync("กำลังโหลด…","saving");
  let ld=null;try{const r=localStorage.getItem(KEY);if(r)ld=JSON.parse(r);}catch(e){}
  let loaded=false;
  if(sb){
    try{
      const{data,error}=await sb.rpc("rpc_stock_load");if(error)throw error;
      if(data&&(data._v||data.materials||data.rounds||data.products||data.items)){
        state=migrate(data);loaded=true;setSync("เชื่อมต่อแล้ว ✓","ok");
        if(data._v!==6) await sb.rpc("rpc_stock_save",{p_data:state});
      } else { state=ld?migrate(ld):migrate(null); await sb.rpc("rpc_stock_save",{p_data:state}); loaded=true; setSync("เชื่อมต่อแล้ว ✓","ok"); }
    }catch(e){console.warn("Supabase:",e);}
  }
  if(!loaded){state=ld?migrate(ld):migrate(null);setSync("ออฟไลน์ (เก็บในเครื่อง)","err");}
  cacheLocal();go(current);
}

const uid=p=>p+Date.now().toString(36)+Math.floor(Math.random()*1000).toString(36);
const fmt=n=>{n=Math.round((n||0)*1000)/1000;return n.toLocaleString("th-TH");};
const baht=n=>"฿"+Math.round(n||0).toLocaleString("th-TH");
const THMON=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function monthLabel(k){if(!k||k==='ไม่ระบุ')return 'ไม่ระบุเดือน';const p=k.split('-');return THMON[(parseInt(p[1])||1)-1]+' '+(parseInt(p[0])+543);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function stat(x){const q=x.qty||0;if(q<=0)return{k:"หมด",c:"c-danger"};if(q<=(x.reorder||0))return{k:"ใกล้หมด",c:"c-warn"};return{k:"พอ",c:"c-ok"};}
const matById=id=>state.materials.find(m=>m.id===id);
const finById=id=>state.finished.find(f=>f.id===id);
const finByName=name=>{name=(name||'').trim();return state.finished.find(f=>(f.name||'').trim()===name);};
const whById=id=>state.warehouse.find(w=>w.id===id);
const lowItems=()=>[...state.materials.map(m=>({...m,_t:'วัตถุดิบ'})),...state.finished.map(f=>({...f,_t:'สินค้า(โรงงาน)'})),...state.warehouse.map(w=>({...w,_t:'คลังรังสิต'}))].filter(x=>(x.name&&x.name.trim())&&(x.qty||0)<=(x.reorder||0)&&(x.reorder>0||x.qty<=0));

/* ===== ROUTER ===== */
const ROUTES={dash:{t:"แดชบอร์ด",f:renderDash},mats:{t:"วัตถุดิบ",f:renderMats},produce:{t:"สั่งผลิต",f:renderProduce},fin:{t:"สินค้าสำเร็จรูป",f:renderFin},wh:{t:"คลังรังสิต",f:renderWh},pays:{t:"เงินที่สั่ง",f:renderPays}};
let current="dash";
function go(r){
  if(!ROUTES[r])r="dash";current=r;
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("active",a.dataset.r===r));
  document.getElementById("pageTitle").textContent=ROUTES[r].t;
  document.getElementById("view").innerHTML="";
  ROUTES[r].f(document.getElementById("view"));
  window.scrollTo(0,0);closeSidebar();refreshAlert();
}
function refreshAlert(){
  const low=lowItems();const el=document.getElementById("topAlert");const dot=document.getElementById("navDot");
  if(low.length){el.className="alert show";el.textContent="⚠️ ใกล้หมด "+low.length+" รายการ";dot.textContent=low.length;dot.classList.add("show");}
  else{el.className="alert";dot.classList.remove("show");}
}
function matsTable(){
  const plants=[...new Set(state.materials.map(m=>m.plant).filter(Boolean))];
  const dlP=`<datalist id="plants">${plants.map(p=>`<option value="${esc(p)}">`).join("")}</datalist>`;
  return `<div class="scroll"><table>
    <thead><tr><th>วัตถุดิบ</th><th>โรงงาน</th><th class="r">คงเหลือ</th><th>หน่วย</th><th class="r">เตือน≤</th><th>สถานะ</th><th></th></tr></thead>
    <tbody>${dlP + (state.materials.length? state.materials.map(m=>{const s=stat(m);return `<tr>
      <td class="namecol"><input class="cell name" value="${esc(m.name)}" placeholder="เช่น เนื้อสครับ" oninput="mSet('${m.id}','name',this.value)"></td>
      <td class="namecol"><input class="cell name" list="plants" value="${esc(m.plant)}" placeholder="โรงงาน" oninput="mSet('${m.id}','plant',this.value)"></td>
      <td class="num"><input class="cell" type="number" step="any" value="${m.qty||''}" placeholder="0" oninput="mSet('${m.id}','qty',this.value)"></td>
      <td class="small"><input class="cell name" value="${esc(m.unit)}" placeholder="โล/ใบ" oninput="mSet('${m.id}','unit',this.value)"></td>
      <td class="small"><input class="cell" type="number" step="any" value="${m.reorder||''}" placeholder="0" oninput="mSet('${m.id}','reorder',this.value)"></td>
      <td><span class="chip ${s.c}">${s.k}</span></td>
      <td style="white-space:nowrap"><button class="icon-btn in" title="รับเข้าเพิ่ม" onclick="receiveMat('${m.id}')">📥</button><button class="icon-btn" title="ลบ" onclick="delMat('${m.id}')">🗑️</button></td>
    </tr>`;}).join("") : `<tr><td colspan="7"><div class="empty">ยังไม่มีวัตถุดิบ — กด “+ เพิ่มวัตถุดิบ”</div></td></tr>`)}</tbody></table></div>`;
}
function finTable(){
  return `<div class="scroll"><table>
    <thead><tr><th>สินค้า</th><th class="r">คงเหลือ</th><th>หน่วย</th><th class="r">เตือน≤</th><th>สถานะ</th><th></th></tr></thead>
    <tbody>${state.finished.length? state.finished.map(f=>{const s=stat(f);return `<tr>
      <td class="namecol"><input class="cell name" value="${esc(f.name)}" placeholder="ชื่อสินค้า" oninput="fSet('${f.id}','name',this.value)"></td>
      <td class="num"><input class="cell" type="number" step="any" value="${f.qty||''}" placeholder="0" oninput="fSet('${f.id}','qty',this.value)"></td>
      <td class="small"><input class="cell name" value="${esc(f.unit)}" placeholder="ชิ้น" oninput="fSet('${f.id}','unit',this.value)"></td>
      <td class="small"><input class="cell" type="number" step="any" value="${f.reorder||''}" placeholder="0" oninput="fSet('${f.id}','reorder',this.value)"></td>
      <td><span class="chip ${s.c}">${s.k}</span></td>
      <td><button class="icon-btn" title="ลบ" onclick="delFin('${f.id}')">🗑️</button></td>
    </tr>`;}).join("") : `<tr><td colspan="6"><div class="empty">ยังไม่มีสินค้า — จะเพิ่มเองเมื่อกดสั่งผลิต หรือกด “+ เพิ่มสินค้า”</div></td></tr>`}</tbody></table></div>`;
}

/* ===== PAGES ===== */
function sumTable(title,arr,route){
  const named=arr.filter(x=>x.name&&x.name.trim());
  return `<div class="panel">

function shipToWh(){
  const avail=state.finished.filter(f=>f.name&&(f.qty||0)>0);
  if(avail.length===0){toast("ยังไม่มีสินค้าที่ผลิตเสร็จให้ส่ง",true);go('fin');return;}
  openModal(`<div class="mh"><h3>🚚 ส่งเข้าคลังรังสิต</h3><button class="x" onclick="closeModal()">×</button></div>
   <div class="mb">
     <div class="field"><label>สินค้า *</label><select id="sh-prod" onchange="shCalc()">${avail.map(f=>`<option value="${f.id}">${esc(f.name)} — ที่โรงงานเหลือ ${fmt(f.qty)} ${esc(f.unit)}</option>`).join("")}</select></div>
     <div class="field"><label>จำนวนที่ส่ง *</label><input id="sh-qty" type="number" step="any" placeholder="เช่น 5000" oninput="shCalc()"></div>
     <div class="prev" id="sh-prev"></div>
   </div>
   <div class="mf"><button class="btn" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" onclick="doShip()">✓ ส่งเข้าคลัง</button></div>`);
  setTimeout(()=>{shCalc();document.getElementById("sh-qty").focus();},50);
}
function shCalc(){
  const f=finById(document.getElementById("sh-prod").value);if(!f)return;
  const qty=Math.max(0,parseFloat((document.getElementById("sh-qty")||{}).value)||0);
  const w=state.warehouse.find(x=>(x.name||'').trim()===(f.name||'').trim());
  const whNow=w?w.qty||0:0;const bad=qty>(f.qty||0);
  document.getElementById("sh-prev").innerHTML=`โรงงาน: ${fmt(f.qty)} → <b class="${bad?'bad':''}">${fmt((f.qty||0)-qty)}</b> ${esc(f.unit)}${bad?' ⚠️ส่งมากกว่าที่มี':''}<br>คลังรังสิต: ${fmt(whNow)} → <b>${fmt(whNow+qty)}</b> ${esc(f.unit)}`;
}
function doShip(){
  const f=finById(document.getElementById("sh-prod").value);if(!f)return;
  const qty=Math.max(0,parseFloat(document.getElementById("sh-qty").value)||0);
  if(qty<=0){toast("ใส่จำนวน",true);return;}
  if(qty>(f.qty||0)){toast(`ส่งได้ไม่เกิน ${fmt(f.qty)} ${f.unit} (ที่โรงงานมี)`,true);return;}
  f.qty=(f.qty||0)-qty;
  let w=state.warehouse.find(x=>(x.name||'').trim()===(f.name||'').trim());
  if(w){w.qty=(w.qty||0)+qty;}else{state.warehouse.push({id:uid('W'),name:f.name,qty,unit:f.unit,reorder:0});}
  save();closeModal();toast("ส่งเข้าคลังรังสิตแล้ว — หักจากโรงงานให้แล้ว");go(current==='wh'?'wh':'fin');
}

function getRecipe(name){const r=state.recipes[name];if(!r)return null;if(Array.isArray(r))return{uses:r};return{uses:r.uses||[]};}
function onProdName(){const name=(document.getElementById("pr-name").value||'').trim();const r=getRecipe(name);if(r&&r.uses.length){prodUses=r.uses.map(u=>({matId:u.matId,per:u.per}));renderProdUses();}}
function matOptions(sel){return state.materials.map(m=>`<option value="${m.id}" ${m.id===sel?'selected':''}>${esc(m.name)} (${esc(m.unit)})</option>`).join("");}
function renderProdUses(){document.getElementById("pr-uses").innerHTML=prodUses.map((u,i)=>`<div class="userow">
   <select onchange="prodUses[${i}].matId=this.value;prCalc()">${matOptions(u.matId)}</select>
   <input type="number" step="any" placeholder="/ชิ้น" value="${u.per||''}" oninput="prodUses[${i}].per=parseFloat(this.value)||0;prCalc()">
   <button class="icon-btn" onclick="rmProdUse(${i})" ${prodUses.length<=1?'style="visibility:hidden"':''}>✕</button></div>`).join("");prCalc();}
function addProdUse(){prodUses.push({matId:state.materials[0].id,per:0});renderProdUses();}
function rmProdUse(i){prodUses.splice(i,1);renderProdUses();}
function prCalc(){const qty=Math.max(0,parseFloat((document.getElementById("pr-qty")||{}).value)||0);const name=((document.getElementById("pr-name")||{}).value||'').trim();let h="";
  prodUses.forEach(u=>{const m=matById(u.matId);if(!m)return;const used=qty*(u.per||0);const after=(m.qty||0)-used;const bad=used>(m.qty||0);h+=`<div>${esc(m.name)}: ใช้ <b>${fmt(used)}</b> ${esc(m.unit)} · เหลือ <b class="${bad?'bad':''}">${fmt(after)}</b>${bad?' ⚠️ไม่พอ':''}</div>`;});
  h+=`<div style="margin-top:5px">ได้สินค้า <b>${esc(name||'—')} +${fmt(qty)}</b> เข้าสต๊อกสำเร็จรูป</div>`;const p=document.getElementById("pr-prev");if(p)p.innerHTML=h;}
function doProduce(){
  const name=(document.getElementById("pr-name").value||'').trim();const qty=Math.max(0,parseFloat(document.getElementById("pr-qty").value)||0);const unit=(document.getElementById("pr-unit").value||'').trim()||'ชิ้น';
  if(!name){toast("ใส่ชื่อสินค้าก่อน",true);return;}if(qty<=0){toast("ใส่จำนวนที่ผลิต",true);return;}
  for(const u of prodUses){const m=matById(u.matId);if(!m)continue;if(qty*(u.per||0)>(m.qty||0)){toast(`${m.name} ไม่พอ (เหลือ ${fmt(m.qty)} ${m.unit})`,true);return;}}
  const uses=[];
  prodUses.forEach(u=>{const m=matById(u.matId);if(!m||!(u.per>0))return;const used=qty*u.per;m.qty=Math.max(0,(m.qty||0)-used);uses.push({name:m.name,used,unit:m.unit});});
  let f=finByName(name);if(f){f.qty=(f.qty||0)+qty;}else{state.finished.push({id:uid('F'),name,qty,unit,reorder:0});}
  state.recipes[name]={uses:prodUses.filter(u=>u.per>0).map(u=>({matId:u.matId,per:u.per}))};
  state.productions.push({id:uid('P'),date:new Date().toISOString().slice(0,10),product:name,qty,unit,uses});
  save();closeModal();toast("ผลิตแล้ว — หักวัตถุดิบ + เพิ่มสินค้าให้แล้ว");go(current==='mats'||current==='fin'||current==='produce'?current:'produce');
}

/* ===== เงิน ===== */
function pSet(id,f,v){const p=state.payments.find(x=>x.id===id);if(!p)return;if(f==='amount'){p.amount=Math.max(0,parseFloat(v)||0);go('pays');}else p[f]=v;save();}
function addPay(){state.payments.push({id:uid('M'),date:new Date().toISOString().slice(0,10),note:'',amount:0});save();go('pays');}
function delPay(id){state.payments=state.payments.filter(p=>p.id!==id);save();go('pays');toast("ลบรายการแล้ว");}

/* ===== CSV ===== */
function dl(name,rows){const csv=rows.map(r=>r.map(c=>{const s=String(c==null?"":c);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(",")).join("\n");const b=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8;"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),500);}
function exportMats(){const r=[["วัตถุดิบ","โรงงาน","คงเหลือ","หน่วย","เตือน≤","สถานะ"]];state.materials.forEach(m=>r.push([m.name,m.plant||'',m.qty||0,m.unit||'',m.reorder||0,stat(m).k]));dl("antheara-วัตถุดิบ.csv",r);}
function exportFin(){const r=[["สินค้า","คงเหลือ","หน่วย","เตือน≤","สถานะ"]];state.finished.forEach(f=>r.push([f.name,f.qty||0,f.unit||'',f.reorder||0,stat(f).k]));dl("antheara-สินค้าสำเร็จรูป.csv",r);}
function exportProd(){const r=[["วันที่","สินค้า","ผลิต","หน่วย","ใช้วัตถุดิบ"]];state.productions.forEach(p=>r.push([p.date,p.product,p.qty,p.unit,(p.uses||[]).map(u=>u.name+" "+u.used+" "+u.unit).join(" | ")]));dl("antheara-ประวัติการผลิต.csv",r);}
function exportWh(){const r=[["สินค้า","คงเหลือ","หน่วย","เตือน≤","สถานะ"]];state.warehouse.forEach(w=>r.push([w.name,w.qty||0,w.unit||'',w.reorder||0,stat(w).k]));dl("antheara-คลังรังสิต.csv",r);}
function exportPays(){const r=[["วันที่","รายการ/รอบ","จำนวนเงิน","เอกสาร"]];const s=[...state.payments].sort((a,b)=>(b.date||'').localeCompare(a.date||''));s.forEach(p=>r.push([p.date||'',p.note||'',p.amount||0,p.doc||'']));dl("antheara-เงินสั่ง.csv",r);}

/* ===== sidebar / modal / toast ===== */
function openSidebar(){document.getElementById("sidebar").classList.add("open");document.getElementById("backdrop").classList.add("show");}
function closeSidebar(){document.getElementById("sidebar").classList.remove("open");document.getElementById("backdrop").classList.remove("show");}
function openModal(h){document.getElementById("modal").innerHTML=h;document.getElementById("modalBg").classList.add("show");}
function closeModal(){document.getElementById("modalBg").classList.remove("show");}
document.getElementById("modalBg").addEventListener("mousedown",e=>{if(e.target.id==="modalBg")closeModal();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});
document.getElementById("nav").addEventListener("click",e=>{const a=e.target.closest("a[data-r]");if(!a)return;e.preventDefault();go(a.dataset.r);});
document.getElementById("burger").addEventListener("click",openSidebar);
document.getElementById("backdrop").addEventListener("click",closeSidebar);
let _tt=null;function toast(m,err){const t=document.getElementById("toast");t.textContent=m;t.className="toast show"+(err?" err":"");clearTimeout(_tt);_tt=setTimeout(()=>t.className="toast"+(err?" err":""),2400);}

boot();
</script>
